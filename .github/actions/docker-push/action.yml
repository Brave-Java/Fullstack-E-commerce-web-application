# Composite action: Docker build + push to Docker Hub
# Equivalent of azure-pipelines/templates/docker-build-push.yml
name: Docker Build & Push to Docker Hub
description: Log in to Docker Hub, build the service image, push with consecutive versioned tags (<env>-v1, <env>-v2, …).

inputs:
  service-name:
    description: Service name — used as the image repository name on Docker Hub
    required: true
  service-dir:
    description: Path to the service directory containing the Dockerfile
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-token:
    description: Docker Hub personal access token
    required: true
  environment:
    description: Deployment environment (dev | test | prod) — determines the version tag prefix
    required: true

outputs:
  image-tag:
    description: The computed consecutive image tag pushed to Docker Hub (e.g. dev-v3)
    value: ${{ steps.version.outputs.image-tag }}

runs:
  using: composite
  steps:
    - name: Compute next image tag
      id: version
      shell: bash
      env:
        DH_USER: ${{ inputs.dockerhub-username }}
        DH_TOKEN: ${{ inputs.dockerhub-token }}
        SERVICE: ${{ inputs.service-name }}
        ENV: ${{ inputs.environment }}
      run: |
        # Authenticate against Docker Hub registry API (handles private repos too)
        TOKEN=$(curl -sf \
          -u "${DH_USER}:${DH_TOKEN}" \
          "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DH_USER}/${SERVICE}:pull" \
          | jq -r '.token // empty')

        # Fetch existing tags — gracefully handles brand-new repos (404 → empty)
        if [ -n "$TOKEN" ]; then
          TAGS=$(curl -sf \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://registry-1.docker.io/v2/${DH_USER}/${SERVICE}/tags/list" \
            | jq -r '.tags[]? // empty' 2>/dev/null || true)
        else
          TAGS=""
        fi

        # Find the highest vN suffix for this environment, then increment
        LATEST=$(printf '%s\n' $TAGS \
          | grep -E "^${ENV}-v[0-9]+$" \
          | sed "s/^${ENV}-v//" \
          | sort -n | tail -1)
        NEXT=$(( ${LATEST:-0} + 1 ))
        IMAGE_TAG="${ENV}-v${NEXT}"

        echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        echo "Computed image tag: ${IMAGE_TAG}"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Build and push ${{ inputs.service-name }}
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.service-dir }}
        file: ${{ inputs.service-dir }}/Dockerfile
        push: true
        tags: |
          ${{ inputs.dockerhub-username }}/${{ inputs.service-name }}:${{ steps.version.outputs.image-tag }}
          ${{ inputs.dockerhub-username }}/${{ inputs.service-name }}:latest-${{ inputs.environment }}
