# Composite action: Docker build + push to a container registry
# Defaults to GitHub Container Registry (ghcr.io) using GITHUB_TOKEN.
# Can also be used with Azure Container Registry by passing acr-registry,
# acr-username, and acr-password inputs.
name: Docker Build & Push
description: Log in to a container registry, build the service image, and push with run-id and latest-<branch> tags.

inputs:
  service-name:
    description: Service name — used as the image repository name
    required: true
  service-dir:
    description: Path to the service directory containing the Dockerfile
    required: true
  registry:
    description: Container registry login server (default ghcr.io)
    required: false
    default: 'ghcr.io'
  registry-username:
    description: Registry username (github.actor for GHCR; service principal client ID for ACR)
    required: true
  registry-password:
    description: Registry password / token (secrets.GITHUB_TOKEN for GHCR; client secret for ACR)
    required: true
  image-prefix:
    description: >
      Full image name prefix before the service name
      (e.g. ghcr.io/my-org or myacr.azurecr.io).
      Defaults to <registry>/<github.repository_owner>.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Compute image prefix
      id: vars
      shell: bash
      run: |
        if [[ -n "${{ inputs.image-prefix }}" ]]; then
          echo "prefix=${{ inputs.image-prefix }}" >> "$GITHUB_OUTPUT"
        else
          echo "prefix=${{ inputs.registry }}/${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Log in to ${{ inputs.registry }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push ${{ inputs.service-name }}
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.service-dir }}
        file: ${{ inputs.service-dir }}/Dockerfile
        push: true
        tags: |
          ${{ steps.vars.outputs.prefix }}/${{ inputs.service-name }}:${{ github.run_id }}
          ${{ steps.vars.outputs.prefix }}/${{ inputs.service-name }}:latest-${{ github.ref_name }}
