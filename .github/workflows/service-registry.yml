# ─────────────────────────────────────────────────────────────────────────────
# Service Registry (Eureka) — GitHub Actions Workflow
# Equivalent of azure-pipelines/service-registry.yml
# Triggers on: dev | test | prod  ·  paths: service-registry source + helm chart
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Required environment secrets (dev / test / prod):
#   AZURE_CREDENTIALS, AKS_CLUSTER_NAME, AKS_RESOURCE_GROUP
# ─────────────────────────────────────────────────────────────────────────────

name: service-registry

on:
  push:
    branches: [dev, test, prod]
    paths:
      - microservice-backend/service-registry/**
      - helm-charts/service-registry/**
      - .github/workflows/service-registry.yml

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/java-build
        with:
          service-dir: microservice-backend/service-registry

  package:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-push
        with:
          service-name: service-registry
          service-dir: microservice-backend/service-registry
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-dev:
    name: Deploy to dev
    needs: package
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: service-registry
          helm-values-key: registry
          helm-chart-path: helm-charts/service-registry
          namespace: dev
          image-tag: ${{ github.run_id }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}

  deploy-test:
    name: Deploy to test
    needs: package
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: service-registry
          helm-values-key: registry
          helm-chart-path: helm-charts/service-registry
          namespace: test
          image-tag: ${{ github.run_id }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}

  deploy-prod:
    name: Deploy to prod
    needs: package
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: service-registry
          helm-values-key: registry
          helm-chart-path: helm-charts/service-registry
          namespace: prod
          image-tag: ${{ github.run_id }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
