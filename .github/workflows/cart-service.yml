# ─────────────────────────────────────────────────────────────────────────────
# Cart Service — GitHub Actions Workflow
# Equivalent of azure-pipelines/cart-service.yml
# Triggers on: dev | test | prod  ·  paths: cart-service source + helm chart
#
# Required repository secrets:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Required environment secrets (dev / test / prod):
#   AZURE_CREDENTIALS, AKS_CLUSTER_NAME, AKS_RESOURCE_GROUP,
#   SPRING_DATA_MONGODB_URI_CART
# ─────────────────────────────────────────────────────────────────────────────

name: cart-service

on:
  push:
    branches: [dev, test, prod]
    paths:
      - microservice-backend/cart-service/**
      - helm-charts/cart-service/**
      - .github/workflows/cart-service.yml

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/java-build
        with:
          service-dir: microservice-backend/cart-service

  package:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.docker.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: docker
        uses: ./.github/actions/docker-push
        with:
          service-name: cart-service
          service-dir: microservice-backend/cart-service
          environment: ${{ github.ref_name }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-dev:
    name: Deploy to dev
    needs: package
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: cart-service
          helm-values-key: cart
          helm-chart-path: helm-charts/cart-service
          namespace: dev
          image-tag: ${{ needs.package.outputs.image-tag }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          extra-helm-args: --set secret.SPRING_DATA_MONGODB_URI_CART=${{ secrets.SPRING_DATA_MONGODB_URI_CART }}

  deploy-test:
    name: Deploy to test
    needs: package
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: cart-service
          helm-values-key: cart
          helm-chart-path: helm-charts/cart-service
          namespace: test
          image-tag: ${{ needs.package.outputs.image-tag }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          extra-helm-args: --set secret.SPRING_DATA_MONGODB_URI_CART=${{ secrets.SPRING_DATA_MONGODB_URI_CART }}

  deploy-prod:
    name: Deploy to prod
    needs: package
    if: github.ref_name == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/helm-deploy
        with:
          service-name: cart-service
          helm-values-key: cart
          helm-chart-path: helm-charts/cart-service
          namespace: prod
          image-tag: ${{ needs.package.outputs.image-tag }}
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
          aks-cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
          aks-resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          extra-helm-args: --set secret.SPRING_DATA_MONGODB_URI_CART=${{ secrets.SPRING_DATA_MONGODB_URI_CART }}
